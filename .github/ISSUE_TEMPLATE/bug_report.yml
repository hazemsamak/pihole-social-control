name: Bug Report
description: Create a report to help us improve PiHole Social Control
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report an issue!
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Pi-hole version (v5/v6), deployment method (Docker/manual), OS, browser.
      placeholder: "e.g., Pi-hole v6, Docker on Ubuntu 24.04, Chrome 125"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open dashboard at '...'
        2. Click '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Paste any server or container log output here.
      render: shell
